name: vellum
description: "Vellum — Type the verse. Own the memory. Kinetic poetry typing and memorization ritual on typewriter paper with liquid glass."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  share_plus: ^9.0.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/data/
    - assets/fonts/
    - assets/images/

  fonts:
    # TT2020 by Fredrick R. Brennan (SIL OFL 1.1), subset to Latin + Cyrillic.
    - family: TT2020
      fonts:
        - asset: assets/fonts/TT2020-StyleE.ttf
        - asset: assets/fonts/TT2020-StyleB.ttf
          weight: 700
