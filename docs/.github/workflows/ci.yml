name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint and Code Formatting Check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Run Test Suite
        env:
          DATABASE_URL: "postgresql://postgres:dev_password@localhost:5432/test_db?schema=public"
          AUTH_SECRET: "test-secret-at-least-32-chars-long"
        run: npm test

      - name: Build Verification
        run: npm run build
